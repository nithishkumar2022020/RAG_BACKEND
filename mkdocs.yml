site_name: PDF RAG
site_description: Architecture, API, operations, and learning guide for the PDF RAG project
site_url: https://nithishkumar2022020.github.io/RAG_BACKEND/
repo_url: https://github.com/nithishkumar2022020/RAG_BACKEND

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Project guide: PROJECT_DOCUMENTATION.md
  - Learning roadmap: LEARNING_ROADMAP.md
  - Evaluation guide: EVALUATION.md
  - Issues and solutions: ISSUES_AND_SOLUTIONS.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - toc:
      permalink: true

strict: true
