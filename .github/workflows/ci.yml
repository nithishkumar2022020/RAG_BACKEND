name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app tests

      - name: Run tests
        run: pytest

      - name: Run offline RAG evaluation
        run: python -m app.evaluation --mode offline --output eval-results/ci.json --compare evaluation/baseline.json

  docs-build:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == github.ref == ('refs/heads/main' || 'refs/heads/develop')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: Publish documentation to GitHub Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [python-checks, docs-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-ghcr:
    name: Build and push API image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: python-checks
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set lowercase GHCR image name
        id: image-name
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-name.outputs.image }}:${{ github.sha }}
            ${{ steps.image-name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-laptop:
    name: Deploy develop to laptop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: python-checks
    runs-on: [self-hosted, macOS, rag-laptop]
    environment: development
    concurrency:
      group: deploy-development-laptop
      cancel-in-progress: false
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4

      - name: Build and restart local stack
        env:
          RAG_DEV_ENV_FILE: ${{ vars.RAG_DEV_ENV_FILE }}
        run: |
          set -euo pipefail
          if [[ -z "$RAG_DEV_ENV_FILE" || ! -r "$RAG_DEV_ENV_FILE" ]]; then
            echo "Configure development variable RAG_DEV_ENV_FILE to a readable local .env file."
            exit 1
          fi
          install -m 600 "$RAG_DEV_ENV_FILE" "$GITHUB_WORKSPACE/.env"
          trap 'rm -f "$GITHUB_WORKSPACE/.env"' EXIT

          docker compose -p rag up -d --build --remove-orphans
          curl --fail --retry 10 --retry-connrefused --retry-delay 3 http://localhost/health
