name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app tests

      - name: Run tests
        run: pytest

  deploy-ec2:
    name: Deploy main to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: python-checks
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Prepare SSH credentials
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_deploy_key"
          chmod 600 "$HOME/.ssh/ec2_deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build and restart production stack
        env:
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid EC2_HOST"; exit 1; }
          [[ "$EC2_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "Invalid EC2_USER"; exit 1; }
          [[ "$EC2_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid EC2_DEPLOY_PATH"; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40,64}$ ]] || { echo "Invalid deployment commit"; exit 1; }

          ssh \
            -i "$HOME/.ssh/ec2_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$EC2_DEPLOY_PATH' '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          deploy_sha="$2"
          cd "$deploy_path"
          git fetch origin main
          git checkout --detach "$deploy_sha"
          docker compose up -d --build --remove-orphans
          curl --fail --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1/health
          REMOTE

  deploy-laptop:
    name: Deploy develop to laptop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: python-checks
    runs-on: [self-hosted, macOS, rag-laptop]
    environment: development
    concurrency:
      group: deploy-development-laptop
      cancel-in-progress: false
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4

      - name: Build and restart local stack
        env:
          RAG_DEV_ENV_FILE: ${{ vars.RAG_DEV_ENV_FILE }}
        run: |
          set -euo pipefail
          if [[ -z "$RAG_DEV_ENV_FILE" || ! -r "$RAG_DEV_ENV_FILE" ]]; then
            echo "Configure development variable RAG_DEV_ENV_FILE to a readable local .env file."
            exit 1
          fi
          install -m 600 "$RAG_DEV_ENV_FILE" "$GITHUB_WORKSPACE/.env"
          trap 'rm -f "$GITHUB_WORKSPACE/.env"' EXIT

          docker compose -p rag up -d --build --remove-orphans
          curl --fail --retry 10 --retry-connrefused --retry-delay 3 http://localhost/health
