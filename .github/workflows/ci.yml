name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app tests

      - name: Run tests
        run: pytest

      - name: Run offline RAG evaluation
        run: python -m app.evaluation --mode offline --output eval-results/ci.json --compare evaluation/baseline.json

  docs-build:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: Publish documentation to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [python-checks, docs-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-ghcr:
    name: Build and push API image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: python-checks
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set lowercase GHCR image name
        id: image-name
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-name.outputs.image }}:${{ github.sha }}
            ${{ steps.image-name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy main image to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-ghcr
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-ec2
      cancel-in-progress: false
    steps:
      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid EC2_HOST"; exit 1; }
          [[ "$EC2_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "Invalid EC2_USER"; exit 1; }
          [[ "$EC2_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$EC2_DEPLOY_PATH" != *".."* ]] || { echo "Invalid EC2_DEPLOY_PATH"; exit 1; }
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]] || { echo "Invalid GHCR_USERNAME"; exit 1; }
          [[ -n "$GHCR_READ_TOKEN" && -n "$EC2_SSH_PRIVATE_KEY" && -n "$EC2_KNOWN_HOSTS" ]] || { echo "Configure GHCR_READ_TOKEN, EC2_SSH_PRIVATE_KEY, and EC2_KNOWN_HOSTS in the production environment"; exit 1; }

      - name: Prepare SSH credentials
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_deploy_key"
          chmod 600 "$HOME/.ssh/ec2_deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Log in to GHCR on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_READ_TOKEN" | ssh \
            -i "$HOME/.ssh/ec2_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Pull and run the published image
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/ec2_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$EC2_DEPLOY_PATH' '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          deploy_sha="$2"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          cd "$deploy_path"
          git fetch origin main
          git checkout --detach "$deploy_sha"
          test -r .env || { echo "Missing deployment .env file"; exit 1; }
          compose=(
          docker compose
          -f "$deploy_path/docker-compose.yml"
          -f "$deploy_path/docker-compose.prod.yml"
          --project-directory "$deploy_path"
          )
          APP_ENV=production IMAGE_TAG="$deploy_sha" "${compose[@]}" pull api
          APP_ENV=production IMAGE_TAG="$deploy_sha" "${compose[@]}" up -d --no-build --remove-orphans
          if ! published_port=$(APP_ENV=production IMAGE_TAG="$deploy_sha" "${compose[@]}" port nginx 80); then
            echo "ERROR: Could not determine the published host port for Nginx container port 80."
            exit 1
          fi
          if [[ ! "$published_port" =~ (^|:)80$ ]]; then
            echo "ERROR: Nginx container port 80 must publish to host port 80; got '${published_port:-no mapping}'."
            exit 1
          fi
          if ! https_port=$(APP_ENV=production IMAGE_TAG="$deploy_sha" "${compose[@]}" port nginx 443); then
          echo "ERROR: Could not determine the published HTTPS port."
          exit 1
          fi

          if [[ ! "$https_port" =~ (^|:)443$ ]]; then
            echo "ERROR: Nginx must publish HTTPS on host port 443; got '${https_port:-no mapping}'."
            exit 1
          fi
                    curl --fail --show-error \
                    --retry 10 \
                    --retry-connrefused \
                    --retry-delay 3 \
                    --resolve synqra-api.duckdns.org:443:127.0.0.1 \
                    https://synqra-api.duckdns.org/health

          REMOTE

  deploy-laptop:
    name: Deploy develop to laptop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: python-checks
    runs-on: [self-hosted, macOS, rag-laptop]
    environment: development
    concurrency:
      group: deploy-development-laptop
      cancel-in-progress: true
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4

      - name: Build and restart local stack
        env:
          RAG_DEV_ENV_FILE: ${{ vars.RAG_DEV_ENV_FILE }}
        run: |
          set -euo pipefail
          if [[ -z "$RAG_DEV_ENV_FILE" ]]; then
            echo "RAG_DEV_ENV_FILE is empty or unavailable. Set it as a variable in the development environment (not as a secret)."
            exit 1
          fi
          if [[ "$RAG_DEV_ENV_FILE" != /* ]]; then
            echo "RAG_DEV_ENV_FILE must be an absolute path on the self-hosted runner."
            exit 1
          fi
          if [[ ! -f "$RAG_DEV_ENV_FILE" ]]; then
            echo "RAG_DEV_ENV_FILE does not point to a file visible to the self-hosted runner."
            exit 1
          fi
          if [[ ! -r "$RAG_DEV_ENV_FILE" ]]; then
            echo "The self-hosted runner user cannot read the file at RAG_DEV_ENV_FILE."
            exit 1
          fi
          install -m 600 "$RAG_DEV_ENV_FILE" "$GITHUB_WORKSPACE/.env"
          trap 'rm -f "$GITHUB_WORKSPACE/.env"' EXIT

          docker compose -p rag up -d --build --remove-orphans
          curl --fail --retry 10 --retry-connrefused --retry-delay 3 http://localhost/health
