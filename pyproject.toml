[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-pdf-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "boto3>=1.35",
  "google-genai>=1.0",
  "pydantic-settings>=2.0",
  "pymilvus>=2.5,<3",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
  "rank-bm25>=0.2",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100