services:
  nginx:
    ports:
      - "443:443"

    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/health"
      interval: 30s
      timeout: 5s
      retries: 3
